<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 老Z的博客</title>
    <meta name="description" content="抱歉，您访问的页面不存在。返回老Z的博客首页，继续探索支付安全、AI大模型等技术内容。">
    <meta name="robots" content="noindex,follow">
    <link rel="canonical" href="https://www.zhaofutao.cn">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 1rem;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #667eea;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        h2 {
            margin: 1rem 0;
            color: #333;
        }
        p {
            margin: 1rem 0;
            color: #666;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        .links {
            margin-top: 2rem;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>页面未找到</h2>
        <p>抱歉，您访问的页面不存在或已被移除。</p>

        <a href="/" class="btn">返回首页</a>
        <a href="/posts/" class="btn">浏览文章</a>

        <div class="links">
            <p>您可能想要访问：</p>

    </div>

    <script>
        // Google Analytics 事件追踪
        if (typeof gtag !== 'undefined') {
            gtag('event', '404_error', {
                'event_category': 'Error',
                'event_label': window.location.pathname,
                'value': 1
            });
        }

        // 自动跳转建议
        const path = window.location.pathname;
        setTimeout(() => {
            if (confirm('是否返回首页继续浏览？')) {
                window.location.href = '/';
            }
        }, 10000);
